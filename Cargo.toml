[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
authors = ["Kyle Lucas <kyle@kylelucas.io>"]
repository = "https://github.com/kylegrantlucas/bender-rs"
homepage = "https://kylegrantlucas.github.io/bender-rs/"

[workspace.dependencies]
bender = { path = "crates/bender" }
bender-gst = { path = "crates/bender-gst" }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
gstreamer = "0.25"
gstreamer-base = "0.25"
gstreamer-video = "0.25"
gstreamer-app = "0.25"
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.37", features = ["persistence"] }
rfd = "0.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
